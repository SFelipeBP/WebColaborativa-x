<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiante</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="card">
        <h1>Registro de Estudiante</h1>
        <p>Complete los siguientes datos para registrarse en el sistema académico.</p>

        <form action="/procesar" method="POST" class="form-container">

            <fieldset>
                <legend>Información Personal</legend>

                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="codigo">Código de estudiante:</label>
                    <input type="text" id="codigo" name="codigo"
                           pattern="[0-9]{8}"
                           maxlength="8"
                           required
                           placeholder="12345678">
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad"
                           min="16" max="100" required>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha de nacimiento:</label>
                    <input type="date" id="fecha" name="fecha"
                           min="1926-01-01"
                           max="2010-12-31"
                           required>
                </div>

            <fieldset>
                <legend>Información de la Cuenta</legend>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password"
                           minlength="8"
                           pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                           required>
                    <small>Mínimo 8 caracteres una mayuscula y un número.</small>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios:</label>
                    <textarea id="comentarios" name="comentarios"
                              rows="4"
                              placeholder="Escriba algún comentario..."></textarea>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="terminos" name="terminos" required>
                        Acepto los términos y condiciones.
                    </label>
                </div>

            </fieldset>

            <div class="buttons">
                <button type="submit">Registrarse</button>
                <button type="reset">Limpiar</button>
            </div>

        </form>
    </main>

</body>
</html>
